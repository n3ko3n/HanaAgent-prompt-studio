<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提示词工坊</title>
  <script src="./assets/theme-boot.js"></script>
  <link rel="stylesheet" href="./assets/studio.css">
  <link rel="stylesheet" href="./assets/panel-shell.css">
</head>
<body data-hana-theme="inherit" data-surface="card">
  <div id="psp" class="psp" data-expanded="false">
    <div class="psp-head" id="psp-bar" role="button" tabindex="0" title="展开 / 收起">
      <span class="psp-name">提示词工坊</span>
      <span class="psp-tools">
        <button class="psp-icon" id="psp-toggle" type="button" title="收起 / 展开" aria-label="收起或展开面板">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 15l6-6 6 6" />
          </svg>
        </button>
        <button class="psp-icon" id="psp-close" type="button" title="关闭面板" aria-label="关闭面板">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </span>
    </div>

    <div class="psp-body" id="psp-body">
      <div id="root" data-surface="card"></div>
    </div>
  </div>

  <script>
    window.addEventListener("error", function (e) {
      var root = document.getElementById("root");
      if (root && !root.innerHTML) {
        root.textContent = "面板加载失败：" + ((e && e.message) || "脚本错误");
      }
    }, true);
  </script>
  <script type="module" src="./assets/panel-shell.js"></script>
  <script type="module" src="./assets/studio.js"></script>
</body>
</html>
